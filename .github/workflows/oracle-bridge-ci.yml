name: UFMS Oracle Bridge CI
on:
  push:
    paths:
      - "integrations/oracle_bridge/**"
      - "docs/integracoes/**"
      - ".github/workflows/oracle-bridge-ci.yml"
  pull_request:
    paths:
      - "integrations/oracle_bridge/**"
      - "docs/integracoes/**"
      - ".github/workflows/oracle-bridge-ci.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar os módulos
        working-directory: integrations/oracle_bridge
        run: python -m compileall -q bridge tests
      - name: Testes isolados, sem credenciais e sem rede
        working-directory: integrations/oracle_bridge
        run: PYTHONPATH=. python -m unittest discover -s tests -v
