name: UFMS Oracle Bridge CI
on:
  push:
    paths:
      - "integrations/oracle_bridge/**"
      - "docs/integracoes/**"
      - ".github/workflows/oracle-bridge-ci.yml"
  pull_request:
    paths:
      - "integrations/oracle_bridge/**"
      - "docs/integracoes/**"
      - ".github/workflows/oracle-bridge-ci.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hash_seed: ["0", "11", "97"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar os módulos
        working-directory: integrations/oracle_bridge
        run: python -m compileall -q bridge tests
      - name: Testes isolados, sem credenciais e sem rede
        working-directory: integrations/oracle_bridge
        env:
          PYTHONHASHSEED: ${{ matrix.hash_seed }}
        run: PYTHONPATH=. python -m unittest discover -s tests -v

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem Docker usada na Oracle
        run: docker build --pull -t ufms-oracle-bridge:ci integrations/oracle_bridge
      - name: Verificar imports, fuso e SQLite como usuário não-root
        run: |
          docker run --rm --entrypoint python ufms-oracle-bridge:ci -c "
          from zoneinfo import ZoneInfo
          from bridge.gateway import Store
          from bridge.agents import INSTRUCTIONS
          from bridge.proactive import ProactiveOutbox
          assert ZoneInfo('America/Campo_Grande').key == 'America/Campo_Grande'
          s = Store('/data/ci-smoke.sqlite3')
          o = ProactiveOutbox(s, 123)
          assert set(INSTRUCTIONS) == {'tutor','coach'}
          assert o.enabled() is False
          print('docker smoke ok')
          "

      - name: Exercitar age real, backup, verificação e restauração sem segredos persistidos
        run: |
          docker run --rm --entrypoint sh ufms-oracle-bridge:ci -ec '
            umask 077
            age-keygen -o /tmp/ci-identity 2>/dev/null >/dev/null
            RECIPIENT="$(age-keygen -y /tmp/ci-identity)"
            python -m bridge.ops_backup backup \
              --db /data/ci-smoke.sqlite3 --output /data/ci-snapshot.age \
              --recipient "$RECIPIENT"
            python -m bridge.ops_backup verify \
              --input /data/ci-snapshot.age --identity /tmp/ci-identity
            python -m bridge.ops_backup restore --confirm-restore \
              --db /data/restored.sqlite3 --input /data/ci-snapshot.age \
              --identity /tmp/ci-identity
            python -c "from bridge.ops_backup import _check_database; from pathlib import Path; _check_database(Path(\"/data/restored.sqlite3\")); print(\"age backup/restore smoke ok\")"
            test -s /data/ci-snapshot.age
            ! grep -a -q "CREATE TABLE reminders" /data/ci-snapshot.age
          '
