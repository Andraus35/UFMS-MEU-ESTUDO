name: Spec Lean UFMS - PLAN r2 aprovado (somente validacao documental)

on:
  pull_request:
    paths:
      - '.specs/features/ufms-cognitive-gates/revisions/v0.3/**'
      - '.specs/features/ufms-cognitive-gates/CURRENT.md'
      - '.github/workflows/spec-lean-snapshot.yml'
  push:
    branches:
      - 'spec/ufms-cognitive-gates-gqd-correction-v0-3'
    paths:
      - '.specs/features/ufms-cognitive-gates/revisions/v0.3/**'
      - '.specs/features/ufms-cognitive-gates/CURRENT.md'
      - '.github/workflows/spec-lean-snapshot.yml'

permissions:
  contents: read

jobs:
  spec-lean-formal-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout HEAD real, sem credenciais persistidas
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Obter e conferir scripts oficiais da Spec Lean por SHA Git
        shell: bash
        run: |
          set -euo pipefail
          TLC_SHA=1da2195067c14ae5d44dc615b31cb26f50ebeb91
          ROOT="https://raw.githubusercontent.com/tech-leads-club/agent-skills/${TLC_SHA}/packages/skills-catalog/skills/%28development%29/tlc-spec-lean/scripts"
          mkdir -p "$RUNNER_TEMP/tlc-official" "$RUNNER_TEMP/tlc-r2-reports"
          for f in lean_config.py validate_plan.py validate_checks.py validate_verification.py; do
            curl --fail --location --retry 3 --silent --show-error "$ROOT/$f" --output "$RUNNER_TEMP/tlc-official/$f"
          done
          cd "$RUNNER_TEMP/tlc-official"
          test "$(git hash-object lean_config.py)" = 'b751517ba653478cd69330e590c8f0de7a739c24'
          test "$(git hash-object validate_plan.py)" = '82f7c754fb9542e659e13a9732cf89d9a25def1f'
          test "$(git hash-object validate_checks.py)" = 'be14d1956cc5afaba6009608c71d7ec1a216c29f'
          test "$(git hash-object validate_verification.py)" = 'b2035193543df146dc5c714979b27a94972d8da4'
          echo "TLC_OFFICIAL_SCRIPTS_GIT_HASHES_MATCH"
      - name: Verificar aprovação humana, snapshot e 27 critérios por SHA
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.specs/features/ufms-cognitive-gates/revisions/v0.3/approved-r2'
          SOURCE='.specs/features/ufms-cognitive-gates/revisions/v0.3/proposals/r2/plan.md'
          echo "AUDITED_HEAD=$(git rev-parse HEAD)" | tee "$RUNNER_TEMP/tlc-r2-reports/provenance.txt"
          test "$(git hash-object "$SOURCE")" = 'a1482c25e064a1ccc06c4a649a704fbd5bf97cf5'
          test "$(git hash-object "$ROOT/plan.md")" = '7b2d3a655e015684088f3ac56fdf90e81349cac1' || { echo 'APPROVED_PLAN_GIT_BLOB_MISMATCH'; exit 1; }
          python "$ROOT/verify_approval_snapshot.py" --root "$ROOT" | tee "$RUNNER_TEMP/tlc-r2-reports/approval-provenance.json"
          python -m unittest discover -s "$ROOT/tests" -v 2>&1 | tee "$RUNNER_TEMP/tlc-r2-reports/approval-tests.log"
          echo 'PLAN_APPROVAL_BOUND_TO_SOURCE_SHA_NO_FUNCTIONAL_PROOF'
      - name: Validar PLAN e CHECKS com scripts oficiais da Tech Leads Club
        shell: bash
        run: |
          set -euo pipefail
          ROOT='.specs/features/ufms-cognitive-gates/revisions/v0.3/approved-r2'
          VALID="$RUNNER_TEMP/tlc-official"
          python "$VALID/validate_plan.py" "$ROOT/plan.md" --root . > "$RUNNER_TEMP/tlc-r2-reports/validate-plan.log" 2>&1 || { cat "$RUNNER_TEMP/tlc-r2-reports/validate-plan.log"; exit 1; }
          python "$VALID/validate_checks.py" "$ROOT/checks.md" --root . > "$RUNNER_TEMP/tlc-r2-reports/validate-checks.log" 2>&1 || { cat "$RUNNER_TEMP/tlc-r2-reports/validate-checks.log"; exit 1; }
          tail -n 4 "$RUNNER_TEMP/tlc-r2-reports/validate-plan.log"
          tail -n 4 "$RUNNER_TEMP/tlc-r2-reports/validate-checks.log"
          echo 'TLC_R2_OFFICIAL_PLAN_CHECKS_FORMAL_PASS_NOT_GQD'
          echo 'FUNCTIONAL_TESTS_C1_C27=NOT_RUN; VERIFY_C=NOT_RUN; VERIFY_O=BLOCKED; INDEPENDENT_GQD=REPROVADA_PENDING_REAUDIT'
      - name: Preservar evidências de validação inclusive em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-r2-approved-formal-logs
          path: ${{ runner.temp }}/tlc-r2-reports/
          retention-days: 14
