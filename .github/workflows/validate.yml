name: Validar harness
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar contrato de segurança da CI
        run: python scripts/ci_gate_contract.py --check
      - name: Verificar bloqueio de resultados pessoais
        run: python scripts/write_policy.py --check
      - name: Validar roadmap e bootstrap
        run: python scripts/roadmap_gate.py --check
      - name: Garantir trabalho serial e PR unico
        run: python scripts/single_flow_gate.py --remote
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validar START controlado de engenharia
        run: python scripts/bootstrap.py --mode engineering
      - name: Validar broker read-only com SHA de checkout
        run: python scripts/agent_entrypoint.py --role engineer --check
        env:
          UFMS_TRUSTED_HEAD_SHA: ${{ github.sha }}
      - name: Validar estrutura e dados
        run: python scripts/validate.py
      - name: Testar regras de integridade
        run: python -m unittest discover -s tests -v
      - name: Medir recuperação do edital
        run: python scripts/benchmark_edital.py
      - name: Medir recuperação adversarial independente dos aliases
        run: python scripts/benchmark_adversarial.py
      - name: Medir separação entre Anexos III IV V
        run: python scripts/benchmark_anexos.py
      - name: Confirmar projeções reproduzíveis
        run: python scripts/rebuild.py --check
