name: Validar harness
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar estrutura e dados
        run: python scripts/validate.py
      - name: Validar integridade do edital
        run: python scripts/chunk_edital.py --check
      - name: Validar linhas do quadro de vagas
        run: python scripts/index_vagas.py --check
      - name: Validar atribuições literais do Anexo IV
        run: python scripts/index_atribuicoes.py --check
      - name: Validar proveniência de fontes e alerta de cronograma
        run: python scripts/validate_fontes_oficiais.py --check
      - name: Testar regras de integridade
        run: python -m unittest discover -s tests -v
      - name: Medir recuperação do edital
        run: python scripts/benchmark_edital.py
      - name: Medir recuperação adversarial independente dos aliases
        run: python scripts/benchmark_adversarial.py
      - name: Medir separação entre Anexos III IV V
        run: python scripts/benchmark_anexos.py
      - name: Confirmar projeções reproduzíveis
        run: python scripts/rebuild.py --check
